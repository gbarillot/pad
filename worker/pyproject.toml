[project]
name = "pad-pdf-worker"
version = "0.1.0"
description = "PDF extraction worker using OCR and Ollama JSON formatting."
requires-python = ">=3.13"
dependencies = [
    "cryptography>=3.1",
    "httpx>=0.27.2",
    "pdf2image>=1.17.0",
    "pillow>=10.4.0",
    "pycap>=2.7.0",
    "pydantic>=2.8.2",
    "pypdf>=4.3.1",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-W ignore::ResourceWarning"
filterwarnings = [
    "ignore:unclosed database in <sqlite3.Connection object:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/extraction.py",
    "app/ollama.py",
    "app/pdf.py",
    "app/runtime_tools.py",
    "app/transfer.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
